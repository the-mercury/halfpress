name: Deploy app

# One Pages site holds both copies: main at the root, dev under /dev/ as a
# preview to check on a phone before releasing. A push to either branch
# rebuilds the whole site from the latest of both.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - uses: actions/checkout@v5
        with:
          ref: dev
          path: dev

      - name: Assemble the site
        run: |
          cp -r main/app site
          rm -rf site/tests site/dev
          cp -r dev/app site/dev
          rm -rf site/dev/tests
          sed -i 's/"name": "HalfPress"/"name": "HalfPress Dev"/; s/"short_name": "HalfPress"/"short_name": "HP Dev"/' site/dev/manifest.webmanifest
          sed -i 's/<title>\([^<]*\)<\/title>/<title>\1 (dev)<\/title>/; s/content="HalfPress"/content="HP Dev"/' site/dev/index.html
          # A small tag naming the dev commit, to tell which build the phone is running.
          tag="dev $(git -C dev rev-parse --short HEAD)"
          sed -i "s|</body>|<div style=\"position:fixed;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;font:11px ui-monospace,Menlo,monospace;color:#94a3b1;background:rgba(14,18,23,.85);padding:2px 6px;border-radius:6px;pointer-events:none\">$tag</div></body>|" site/dev/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job, as in GitHub's own Pages workflow: deploying in the same job
  # as the upload sometimes asked for the site before GitHub had it listed.
  deploy:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
